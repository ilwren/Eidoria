name: Media backend publish probe

# 临时诊断工作流（合并前删除）：把 linux 自包含发布与 Native AOT 发布的完整输出
# 回传到 ci-artifacts 分支，因为沙箱侧读不到 Actions 的日志 blob。
on:
  push:
    branches: ["arena/9726693a-eidoria"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Capture linux publish output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Self-contained publish (captured)
        run: |
          set -o pipefail
          dotnet publish src/MdExplorer.Desktop -c Release -r linux-x64 --self-contained true -o artifacts/linux-x64 > publish-selfcontained.txt 2>&1 || true
          echo "=== exit above captured ==="
          grep -nE "error|Error|NU[0-9]{4}|warning IL" publish-selfcontained.txt | head -60 || true
      - name: Native AOT publish (captured)
        run: |
          set -o pipefail
          dotnet publish src/MdExplorer.Desktop -c Release -r linux-x64 -p:PublishAot=true > publish-aot.txt 2>&1 || true
          echo "=== exit above captured ==="
          grep -nE "error|Error|NU[0-9]{4}|warning IL" publish-aot.txt | head -60 || true
      - name: Publish captured logs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-artifacts.sh media-probe publish-selfcontained.txt publish-aot.txt
